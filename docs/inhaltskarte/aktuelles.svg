<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" role="img" aria-labelledby="title">
  <title id="title">Skizze: Aktuelles (Übersicht der Beiträge)</title>
  <defs>
    <!-- Roughens the lines so the sketch reads as a draft. Text is not filtered and stays sharp. -->
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <style>
      text { font-family: "Bradley Hand", "Segoe Print", "Chalkboard SE", "Comic Sans MS", cursive; }
      .ink, .grey { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: url(#rough); }
      .ink { stroke: #2b2b2b; }
      .grey { stroke: #a3a3a3; }
      .thin { stroke-width: 1.5; }
      .btn { fill: #ffe8d9; }
      .sym { font-family: Arial, Helvetica, sans-serif; }
      .t { fill: #2b2b2b; }
      .g { fill: #8a8a8a; }
      .badge rect { fill: #d9480f; }
      .badge.ref rect { fill: #9a9a9a; }
      .badge text { fill: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; }
    </style>
  </defs>
  <!-- Orange badges mark the blocks of this sketch. Grey badges point to shared blocks drawn in gemeinsam.svg. -->
  <!-- White paper, so the sketch reads the same in light and dark mode -->
  <rect width="800" height="820" fill="#fffdf7"/>
  <rect class="ink" x="20" y="20" width="760" height="780" rx="12"/>
  <path class="ink thin" d="M20 48 h760"/>
  <circle class="ink thin" cx="38" cy="34" r="4"/>
  <circle class="ink thin" cx="54" cy="34" r="4"/>
  <circle class="ink thin" cx="70" cy="34" r="4"/>

  <!-- Section photo behind the title (A1) -->
  <rect class="grey" x="22" y="49" width="756" height="330" rx="6"/>
  <path class="grey thin" d="M22 49 L778 379 M778 49 L22 379"/>
  <g class="badge"><rect x="44" y="238" width="32" height="24" rx="12"/><text x="60" y="255" text-anchor="middle">A1</text></g>
  <rect class="grey" x="40" y="62" width="720" height="40" rx="14"/>
  <text class="g" x="60" y="88" font-size="14" text-anchor="start">Kopfzeile: Seitenname, Menü, Hell/Dunkel</text>
  <g class="badge ref"><rect x="700" y="70" width="59" height="24" rx="12"/><text x="730" y="87" text-anchor="middle">G1–G3</text></g>
  <rect class="grey" x="110" y="118" width="580" height="70" rx="6"/>
  <path class="grey thin" d="M110 118 L690 188 M690 118 L110 188"/>
  <text class="g" x="130" y="176" font-size="15" text-anchor="start">Banner</text>
  <g class="badge ref"><rect x="644" y="141" width="32" height="24" rx="12"/><text x="660" y="158" text-anchor="middle">G4</text></g>

  <!-- Title (A2) and intro text (A3) -->
  <text class="t" x="110" y="290" font-size="36" text-anchor="start" font-weight="bold">Aktuelles</text>
  <g class="badge"><rect x="274" y="268" width="32" height="24" rx="12"/><text x="290" y="285" text-anchor="middle">A2</text></g>
  <path class="ink thin" d="M110 330 h420 M110 348 h420 M110 366 h252"/>
  <g class="badge"><rect x="544" y="333" width="32" height="24" rx="12"/><text x="560" y="350" text-anchor="middle">A3</text></g>

  <!-- Post cards, newest first (A4) -->
  <rect class="grey" x="110" y="420" width="180" height="130" rx="10"/>
  <text class="g" x="124" y="448" font-size="14" text-anchor="start" font-weight="bold">Titel des Beitrags</text>
  <text class="g" x="124" y="470" font-size="12" text-anchor="start">28. Oktober 2026 · 1 min</text>
  <path class="grey thin" d="M124 492 h150 M124 506 h150 M124 520 h90"/>
  <rect class="grey" x="310" y="420" width="180" height="130" rx="10"/>
  <text class="g" x="324" y="448" font-size="14" text-anchor="start" font-weight="bold">Titel des Beitrags</text>
  <text class="g" x="324" y="470" font-size="12" text-anchor="start">28. Oktober 2026 · 1 min</text>
  <path class="grey thin" d="M324 492 h150 M324 506 h150 M324 520 h90"/>
  <rect class="grey" x="510" y="420" width="180" height="130" rx="10"/>
  <text class="g" x="524" y="448" font-size="14" text-anchor="start" font-weight="bold">Titel des Beitrags</text>
  <text class="g" x="524" y="470" font-size="12" text-anchor="start">28. Oktober 2026 · 1 min</text>
  <path class="grey thin" d="M524 492 h150 M524 506 h150 M524 520 h90"/>
  <rect class="grey" x="110" y="570" width="180" height="130" rx="10"/>
  <text class="g" x="124" y="598" font-size="14" text-anchor="start" font-weight="bold">Titel des Beitrags</text>
  <text class="g" x="124" y="620" font-size="12" text-anchor="start">28. Oktober 2026 · 1 min</text>
  <path class="grey thin" d="M124 642 h150 M124 656 h150 M124 670 h90"/>
  <g class="badge"><rect x="694" y="408" width="32" height="24" rx="12"/><text x="710" y="425" text-anchor="middle">A4</text></g>
  <rect class="grey" x="40" y="745" width="720" height="44" rx="8" stroke-dasharray="6 6"/>
  <text class="g" x="60" y="772" font-size="14" text-anchor="start">Fußzeile: Impressum · Datenschutz · <tspan class="sym">©</tspan> · Nach oben</text>
  <g class="badge ref"><rect x="696" y="755" width="59" height="24" rx="12"/><text x="725" y="772" text-anchor="middle">G6–G9</text></g>
</svg>
