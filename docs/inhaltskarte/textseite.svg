<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="title">
  <title id="title">Skizze: Textseite (Über uns, Kontakt, Impressum, Datenschutz)</title>
  <defs>
    <!-- Roughens the lines so the sketch reads as a draft. Text is not filtered and stays sharp. -->
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <style>
      text { font-family: "Bradley Hand", "Segoe Print", "Chalkboard SE", "Comic Sans MS", cursive; }
      .ink, .grey { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: url(#rough); }
      .ink { stroke: #2b2b2b; }
      .grey { stroke: #a3a3a3; }
      .thin { stroke-width: 1.5; }
      .btn { fill: #ffe8d9; }
      .sym { font-family: Arial, Helvetica, sans-serif; }
      .t { fill: #2b2b2b; }
      .g { fill: #8a8a8a; }
      .badge rect { fill: #d9480f; }
      .badge.ref rect { fill: #9a9a9a; }
      .badge text { fill: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; }
    </style>
  </defs>
  <!-- Orange badges mark the blocks of this sketch. Grey badges point to shared blocks drawn in gemeinsam.svg. -->
  <!-- White paper, so the sketch reads the same in light and dark mode -->
  <rect width="800" height="800" fill="#fffdf7"/>
  <rect class="ink" x="20" y="20" width="760" height="760" rx="12"/>
  <path class="ink thin" d="M20 48 h760"/>
  <circle class="ink thin" cx="38" cy="34" r="4"/>
  <circle class="ink thin" cx="54" cy="34" r="4"/>
  <circle class="ink thin" cx="70" cy="34" r="4"/>
  <rect class="grey" x="40" y="62" width="720" height="40" rx="14"/>
  <text class="g" x="60" y="88" font-size="14" text-anchor="start">Kopfzeile: Seitenname, Menü, Hell/Dunkel</text>
  <g class="badge ref"><rect x="700" y="70" width="59" height="24" rx="12"/><text x="730" y="87" text-anchor="middle">G1–G3</text></g>
  <rect class="grey" x="110" y="118" width="580" height="70" rx="6"/>
  <path class="grey thin" d="M110 118 L690 188 M690 118 L110 188"/>
  <text class="g" x="130" y="176" font-size="15" text-anchor="start">Banner</text>
  <g class="badge ref"><rect x="644" y="141" width="32" height="24" rx="12"/><text x="660" y="158" text-anchor="middle">G4</text></g>

  <!-- Title (T1) -->
  <text class="t" x="110" y="250" font-size="34" text-anchor="start" font-weight="bold">Über uns</text>
  <g class="badge"><rect x="254" y="228" width="32" height="24" rx="12"/><text x="270" y="245" text-anchor="middle">T1</text></g>

  <!-- Body text (T2), subheadings (T3), lists and tables (T4) -->
  <path class="ink thin" d="M110 290 h520 M110 308 h520 M110 326 h312"/>
  <g class="badge"><rect x="644" y="293" width="32" height="24" rx="12"/><text x="660" y="310" text-anchor="middle">T2</text></g>
  <text class="t" x="110" y="375" font-size="21" text-anchor="start" font-weight="bold">Unser Verein</text>
  <g class="badge"><rect x="244" y="356" width="32" height="24" rx="12"/><text x="260" y="373" text-anchor="middle">T3</text></g>
  <path class="ink thin" d="M110 405 h520 M110 423 h520 M110 441 h312"/>
  <text class="t" x="110" y="490" font-size="21" text-anchor="start" font-weight="bold">Vorstand</text>
  <rect class="ink thin" x="110" y="510" width="400" height="105" rx="4"/>
  <path class="ink thin" d="M110 545 h400 M110 580 h400 M300 510 v105"/>
  <text class="t" x="125" y="533" font-size="14" text-anchor="start" font-weight="bold">Funktion</text>
  <text class="t" x="315" y="533" font-size="14" text-anchor="start" font-weight="bold">Name</text>
  <g class="badge"><rect x="524" y="548" width="32" height="24" rx="12"/><text x="540" y="565" text-anchor="middle">T4</text></g>
  <path class="ink thin" d="M110 650 h380 M110 668 h228"/>
  <rect class="grey" x="40" y="725" width="720" height="44" rx="8" stroke-dasharray="6 6"/>
  <text class="g" x="60" y="752" font-size="14" text-anchor="start">Fußzeile: Impressum · Datenschutz · <tspan class="sym">©</tspan> · Nach oben</text>
  <g class="badge ref"><rect x="696" y="735" width="59" height="24" rx="12"/><text x="725" y="752" text-anchor="middle">G6–G9</text></g>
</svg>
